<!DOCTYPE html>
<html>
<head>

        }
        .navbar {
            background-color: #B3D9FF;
            padding: 15px;
            text-align: left;
            padding-left: 30px;
        }
        .navbar a {
            color: #000000;
            text-decoration: none;
            padding: 10px 20px;
            margin: 0 10px;
            display: inline-block;
        }
        .navbar a:hover {
            text-decoration: underline;
        }
        .content {
            text-align: center;
            padding: 50px;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 40px;
        }
        .buttons {
            margin-top: 30px;
        }
        .buttons a {
            color: #000000;
            text-decoration: none;
            padding: 15px 30px;
            margin: 10px;
            background-color: #99CCFF;
            border-radius: 8px;
            display: inline-block;
            font-size: 18px;
        }
        .buttons a:hover {
            background-color: #66B3FF;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/capitala">Capitala</a>
        <a href="/steag">Steag</a>
        <a href="/populatie">Populație</a>
    </div>
    <div class="content">
        <h1>Coreea de Sud</h1>
        <p style="max-width: 800px; margin: 0 auto 30px auto; font-size: 18px; line-height: 1.6;">{{ descriere }}</p>
        <div class="buttons">
            <a href="/capitala">Capitala</a>
            <a href="/steag">Steag</a>
            <a href="/populatie">Populație</a>
        </div>
    </div>
</body>
</html>
